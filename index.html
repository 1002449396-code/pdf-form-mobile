<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2257C7">
<title>עורך טפסים</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="topbar">
  <div class="title-wrap">
    <div class="title" id="doc-title">עורך טפסים</div>
    <div class="page-count" id="page-count" hidden></div>
  </div>
  <button class="icon-btn" id="btn-share" type="button" aria-label="שיתוף הקובץ" hidden>
    <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4"/><path d="m15.4 6.5-6.8 4"/></svg>
  </button>
  <button class="icon-btn" id="btn-menu" type="button" aria-label="תפריט">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>
  </button>
</header>

<main id="stage" class="stage">
  <section class="empty" id="empty">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 14h6"/><path d="M9 17h4"/></svg>
    </div>
    <h1>מילוי טפסים וחתימה</h1>
    <p>הקובץ נשאר בטלפון שלך. שום דבר לא נשלח לאינטרנט.</p>
    <button class="primary" id="btn-open-big" type="button">פתיחת קובץ PDF</button>
    <p class="hint">אפשר גם לפתוח ישירות מוואטסאפ או מהמייל:<br>לוחצים על הקובץ ← <b>שיתוף</b> ← <b>עורך טפסים</b>.</p>
  </section>
  <div id="pages" class="pages" hidden></div>
</main>

<nav class="toolbar" id="toolbar" hidden>
  <button class="tool" data-tool="text" type="button">
    <svg viewBox="0 0 24 24"><path d="M5 6V4h14v2"/><path d="M12 4v16"/><path d="M9 20h6"/></svg>
    <span>טקסט</span>
  </button>
  <button class="tool" data-tool="check" type="button">
    <svg viewBox="0 0 24 24"><path d="M4.5 12.5 9.5 17.5 19.5 6.5"/></svg>
    <span>וי</span>
  </button>
  <button class="tool" data-tool="date" type="button">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4"/><path d="M8 3v4"/><path d="M3 10h18"/></svg>
    <span>תאריך</span>
  </button>
  <button class="tool" data-tool="sign" type="button">
    <svg viewBox="0 0 24 24"><path d="M3 17c3-1 4-9 7-9 2 0 0 7 2 7s2-3 4-3 2 2 5 2"/><path d="M3 21h18"/></svg>
    <span>חתימה</span>
  </button>
  <button class="tool" data-tool="detail" type="button">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
    <span>פרטים</span>
  </button>
  <button class="tool" id="btn-undo" type="button" disabled>
    <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    <span>ביטול</span>
  </button>
</nav>

<input type="file" id="file-input" accept="application/pdf,.pdf" hidden>
<div class="toast" id="toast" role="status" hidden></div>
<div class="busy" id="busy" hidden><div class="busy-box"><div class="spinner"></div><span id="busy-text"></span></div></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
